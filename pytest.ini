[pytest]
addopts = -ra --strict-markers
markers =
    smoke: critical end-to-end checks
    regression: regression coverage from the Excel suite
    security: safe security-input checks
    positive: positive scenarios
    negative: negative scenarios
    boundary: boundary-value scenarios
    edge: edge-case scenarios
    critical: high-priority scenarios
    bug_001: linked to Bug 001
    bug_006: linked to Bug 006
    bug_007: linked to Bug 007
    bug_008: linked to Bug 008
    bug_012: linked to Bug 012
    bug_015: linked to Bug 015
    bug_016: linked to Bug 016
    bug_017: linked to Bug 017
    bug_018: linked to Bug 018
    bug_019: linked to Bug 019
    bug_020: linked to Bug 020
    bug_022: linked to Bug 022
    bug_023: linked to Bug 023
python_files = test_*.py
python_functions = test_*
testpaths = tests
